<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Personal AI</title>
    <style>
        body { font-family: sans-serif; margin: 20px; background-color: #f4f4f9; color: #333; }
        h1 { color: #4a4a8a; text-align: center; }
        #chat-box { background: white; padding: 15px; border-radius: 10px; height: 400px; overflow-y: scroll; border: 1px solid #ddd; margin-bottom: 15px; }
        .user-msg { text-align: right; color: #007bff; margin: 5px 0; }
        .ai-msg { text-align: left; color: #28a745; margin: 5px 0; }
        #input-area { display: flex; }
        #user-input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 5px 0 0 5px; }
        #send-btn { padding: 10px 20px; background: #4a4a8a; color: white; border: none; border-radius: 0 5px 5px 0; cursor: pointer; }
    </style>
</head>
<body>
    <h1>My Personal AI Assistant</h1>
    <div id="chat-box"></div>
    <div id="input-area">
        <input type="text" id="user-input" placeholder="မေးခွန်းတစ်ခုခုရိုက်ထည့်ပါ...">
        <button id="send-btn">ပို့မယ်</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
